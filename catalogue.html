<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Royal Tanks | Shop Royal</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f7f9fc;color:#142033;overflow-x:hidden}header{height:70px;padding:0 5%;display:flex;align-items:center;justify-content:space-between;background:#041426;color:#fff;position:sticky;top:0;z-index:20}.logo{color:#fff;text-decoration:none;font-size:23px;font-weight:900}.logo span{color:#f2b632}nav{display:flex;gap:20px}nav a{color:#fff;text-decoration:none;font-weight:700}.cart-button{background:#0754a4;color:#fff;border:0;border-radius:9px;padding:10px 15px;font-weight:800}.cart-count{background:#f2b632;color:#111;border-radius:50%;padding:3px 7px;margin-left:4px}.head{text-align:center;background:#fff;padding:25px 15px;border-bottom:1px solid #e5eaf0}.head h1{margin:0;color:#073b7a;font-size:34px}.shop{max-width:1200px;margin:auto;padding:28px 5% 60px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:20px}.card{background:#fff;border:1px solid #e1e7ef;border-radius:15px;overflow:hidden;box-shadow:0 7px 22px #06172d12}.pic{height:245px;background:#fff;position:relative;display:flex;align-items:center;justify-content:center;padding:12px;overflow:hidden}.pic img{width:100%;height:100%;object-fit:contain;object-position:center;display:block}.brand{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);background:#061a2e;color:#fff;border:2px solid #f2b632;border-radius:20px;padding:5px 11px;font-size:11px;font-weight:900;letter-spacing:1px;white-space:nowrap;z-index:2}.info{padding:16px}.info h2{margin:0 0 5px;color:#073b7a;font-size:19px}.info p{margin:0;color:#64748b}.price{font-size:18px;font-weight:900;margin:10px 0;color:#111}.add{width:100%;padding:11px;border:0;border-radius:8px;background:#073b7a;color:#fff;font-weight:900;cursor:pointer}.add.added{background:#16a34a}.cart-panel{position:fixed;top:0;right:-410px;width:min(390px,92vw);height:100vh;background:#fff;z-index:100;padding:22px;box-shadow:-8px 0 30px #0003;transition:.25s;overflow:auto}.cart-panel.open{right:0}.close{float:right;border:0;background:none;font-size:28px}.item{padding:13px 0;border-bottom:1px solid #e5eaf0;display:flex;justify-content:space-between;gap:10px}.item button{border:0;border-radius:6px;padding:6px 9px}.del{background:#fee2e2;color:#991b1b}.qty{background:#073b7a;color:#fff}.total{font-size:20px;font-weight:900;margin:20px 0}.order{width:100%;padding:13px;border:0;border-radius:9px;background:#16a34a;color:#fff;font-weight:900}.overlay{display:none;position:fixed;inset:0;background:#0005;z-index:90}.overlay.show{display:block}.modal{display:none;position:fixed;inset:0;background:#0007;z-index:110;align-items:center;justify-content:center;padding:18px}.modal.show{display:flex}.box{background:#fff;border-radius:16px;padding:22px;width:min(450px,100%)}.box label{display:block;font-weight:800;margin-top:12px}.box input{width:100%;padding:12px;margin-top:5px;border:1px solid #cbd5e1;border-radius:8px}.send{width:100%;margin-top:18px;padding:13px;border:0;border-radius:9px;background:#16a34a;color:#fff;font-weight:900}@media(max-width:700px){header{height:62px;padding:0 12px}nav{display:none}.logo{font-size:19px}.head{padding:20px 10px}.head h1{font-size:28px}.shop{padding:18px 12px 45px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.pic{height:190px;padding:8px}.info{padding:11px}.info h2{font-size:16px}.info p{font-size:13px}.price{font-size:16px}.add{font-size:13px;padding:10px}}@media(max-width:380px){.grid{grid-template-columns:1fr}.pic{height:260px}}</style></head><body><header><a class="logo" href="index.html">ROYAL <span>TANKS</span></a><nav><a href="index.html">Home</a><a href="catalogue.html">Shop Now</a><a href="index.html#about">About</a><a href="index.html#contact">Contact</a></nav><button class="cart-button" onclick="openCart()">🛒 Cart <span class="cart-count" id="count">0</span></button></header><section class="head"><h1>Shop Royal</h1></section><main class="shop"><div class="grid" id="products"></div></main><div class="overlay" id="overlay" onclick="closeCart()"></div><aside class="cart-panel" id="cartPanel"><button class="close" onclick="closeCart()">×</button><h2>🛒 Your Cart</h2><div id="items"></div><div class="total" id="total"></div><button class="order" onclick="checkout()">ORDER NOW VIA WHATSAPP</button></aside><div class="modal" id="modal"><form class="box" onsubmit="send(event)"><h2>HELLO 👋</h2><p>Complete your order details.</p><label>Your Name<input id="name" required></label><label>Phone Number<input id="phone" type="tel" required></label><label>Delivery Area<input id="area" required></label><button class="send">SEND ORDER TO WHATSAPP</button></form></div><script>const img1000='https://royal.ps/public/storage/products/April2021/WG823h8dWGeW8W2JlMhw.jpg',img2000='https://royal.ps/storage/products/April2021/OOpcywltkprLUckm8vbr.jpg',img3000='https://static.wixstatic.com/media/7168a0_aed15a259521475b9626b87e475e5a7a~mv2.jpg/v1/fill/w_560%2Ch_622%2Cal_c%2Cq_80%2Cusm_0.66_1.00_0.01%2Cenc_avif%2Cquality_auto/7168a0_aed15a259521475b9626b87e475e5a7a~mv2.jpg',img4000='royal-4000-image.svg',img5000='https://polytanksafrica.com/wp-content/uploads/2022/08/5000-short-2.png',img6000='https://i.postimg.cc/QdC4F3Nr/Chat-GPT-Image-Aug-22-2026-10-49-00-PM.png',img8000='https://www.novatanks.co.ke/cdn/shop/files/10K.png?v=1688827035',img10000='https://i.postimg.cc/CxJ0gYvt/Chat-GPT-Image-Aug-22-2026-10-54-58-PM.png',img16000='https://media.bunnings.com.au/api/public/content/6d46693932874a568b2e0d9ee2a1579f?t=w1200&v=caf4eca2',img20000='https://www.tanks-direct.co.uk/images/products/large/6815_15483.jpg',img24000='https://i.postimg.cc/kRxLbWrK/Chat-GPT-Image-Aug-22-2026-10-55-13-PM.png';const tankProducts=[['1,000 Litres',4500,img1000],['2,000 Litres',10500,img2000],['3,000 Litres',12500,img3000],['4,000 Litres',14500,img4000],['5,000 Litres',16500,img5000],['6,000 Litres',19500,img6000],['8,000 Litres',24500,img8000],['10,000 Litres',32500,img10000],['16,000 Litres',88500,img16000],['20,000 Litres',137500,img20000],['24,000 Litres',162500,img24000]];let cartItems=JSON.parse(localStorage.getItem('royalTanksCart')||'[]');if(!Array.isArray(cartItems))cartItems=[];function add(id,name,price,b){let x=cartItems.find(i=>i.id===id);x?x.qty++:cartItems.push({id,name,price,qty:1});save();b.textContent='✓ ADDED';b.classList.add('added');setTimeout(()=>{b.textContent='ADD TO CART';b.classList.remove('added')},1300)}function save(){localStorage.setItem('royalTanksCart',JSON.stringify(cartItems));render()}function render(){document.getElementById('count').textContent=cartItems.reduce((s,i)=>s+i.qty,0);document.getElementById('items').innerHTML=cartItems.length?cartItems.map((x,i)=>`<div class="item"><span><b>${x.name}</b><br>KSh. ${x.price.toLocaleString()} × ${x.qty}</span><span><button class="qty" onclick="change(${i},1)">+</button><button class="qty" onclick="change(${i},-1)">−</button><button class="del" onclick="del(${i})">Delete</button></span></div>`).join(''):'<p>Your cart is empty.</p>';document.getElementById('total').textContent='Total: KSh. '+cartItems.reduce((s,i)=>s+i.price*i.qty,0).toLocaleString()}function change(i,d){cartItems[i].qty+=d;if(cartItems[i].qty<1)cartItems.splice(i,1);save()}function del(i){cartItems.splice(i,1);save()}function openCart(){document.getElementById('cartPanel').classList.add('open');document.getElementById('overlay').classList.add('show');render()}function closeCart(){document.getElementById('cartPanel').classList.remove('open');document.getElementById('overlay').classList.remove('show')}function checkout(){if(!cartItems.length)return alert('Please add a tank first.');closeCart();document.getElementById('modal').classList.add('show')}function send(e){e.preventDefault();let list=cartItems.map((x,i)=>`${i+1}. ${x.name} | Qty: ${x.qty} | KSh. ${(x.price*x.qty).toLocaleString()}`).join('\n'),total=cartItems.reduce((s,i)=>s+i.price*i.qty,0),msg=`HELLO 👋 ROYAL TANKS, I would like to place an order.\n\nName: ${name.value}\nPhone: ${phone.value}\nDelivery Area: ${area.value}\n\nORDER:\n${list}\n\nTOTAL: KSh. ${total.toLocaleString()}`;window.open('https://wa.me/254102938597?text='+encodeURIComponent(msg),'_blank')}function card(p,i){return`<article class="card"><div class="pic"><img src="${p[2]}" alt="Royal Tanks ${p[0]}" loading="lazy" onerror="this.onerror=null;this.src=img1000"><span class="brand">ROYAL TANKS</span></div><div class="info"><h2>${p[0]}</h2><p>Royal Water Tank</p><div class="price">KSh. ${p[1].toLocaleString()}</div><button class="add" onclick='add(${i},${JSON.stringify(p[0])},${p[1]},this)'>ADD TO CART</button></div></article>`}document.getElementById('products').innerHTML=tankProducts.map(card).join('');render();</script></body></html>
