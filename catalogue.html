ton></div></div><div class="modal" id="checkoutModal"><div class="panel"><button class="close" onclick="closeCheckout()">×</button><b>HELLO 👋</b><h2>Complete Your Order</h2><form id="form"><label>Full Name<input id="name" required></label><label>Phone Number<input id="phone" required type="tel"></label><label>Delivery Town / Area<input id="area" required></label><button class="checkout">SEND ORDER TO WHATSAPP</button></form></div></div><footer>© 2026 Royal Tanks • Nakuru, Kenya • 0102938597</footer><script>const tankProducts=[['Royal Tanks 1,000 Litres',4500,'https://qatarplastic.ke/wp-content/uploads/2025/01/1000L.png'],['Royal Tanks 2,000 Litres',10500,'https://sunrisetank.com/wp-content/uploads/2025/04/22-1.png'],['Royal Tanks 3,000 Litres',12500,'https://qatarplastic.ke/wp-content/uploads/2025/01/3000L-1000x1000.png'],['Royal Tanks 4,000 Litres',14500,'https://cdn.shopify.com/s/files/1/0268/7926/2823/products/500Litre-tank_852850d1-0a1f-4bd8-b9bb-c748609420f7_800x.png?v=1616757932'],['Royal Tanks 5,000 Litres',16500,'https://4.imimg.com/data4/WW/KE/ANDROID-5515598/product.jpeg'],['Royal Tanks 6,000 Litres',19500,'https://marketplace.flexpay.co.ke/wp-content/uploads/2023/08/roto-tanks.png'],['Royal Tanks 8,000 Litres',24500,'https://viwanda.ke/wp-content/uploads/2022/01/Roto-Tank-8000L_Tanks_26148_1.jpeg'],['Royal Tanks 10,000 Litres',32500,'https://qatarplastic.ke/wp-content/uploads/2025/01/10000L-2-1000x1000.png'],['Royal Tanks 16,000 Litres',88500,'https://media.bunnings.com.au/api/public/content/6d46693932874a568b2e0d9ee2a1579f?t=w1200&v=caf4eca2'],['Royal Tanks 20,000 Litres',137500,'https://www.tanks-direct.co.uk/images/products/large/6813_15478.jpg'],['Royal Tanks 24,000 Litres',162500,'https://www.benssysolutions.com/web/image/product.product/333/image_1920?unique=97e7961']];let cart=JSON.parse(localStorage.getItem('royalCart')||'[]');function save(){localStorage.setItem('royalCart',JSON.stringify(cart));renderCart()}function add(n,p,b){let x=cart.find(a=>a.name===n);x?x.qty++:cart.push({name:n,price:p,qty:1});save();b.classList.add('added');b.textContent='✓ Added to Cart';setTimeout(()=>{b.classList.remove('added');b.textContent='ADD TO CART'},1400);toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1600)}function remove(i){cart.splice(i,1);save()}function qty(i,d){cart[i].qty=Math.max(1,cart[i].qty+d);save()}function renderCart(){count.textContent=cart.reduce((a,x)=>a+x.qty,0);items.innerHTML=cart.length?cart.map((x,i)=>`<div class="row"><span><b>${x.name}</b><br>Ksh. ${x.price.toLocaleString()} each</span><span><button onclick="qty(${i},-1)">−</button> ${x.qty} <button onclick="qty(${i},1)">+</button> <button class="del" onclick="remove(${i})">Delete</button></span></div>`).join(''):'<p>Your cart is empty.</p>';total.textContent='Total: Ksh. '+cart.reduce((a,x)=>a+x.price*x.qty,0).toLocaleString()}function openCart(){cartModal.style.display='block';renderCart()}function closeCart(){cartModal.style.display='none'}function openCheckout(){if(!cart.length)return alert('Please add a tank first.');closeCart();checkoutModal.style.display='block'}function closeCheckout(){checkoutModal.style.display='none'}function card(p){let lit=parseInt(p[0].replace(/[^0-9]/g,'')),scale=Math.min(98,54+Math.sqrt(lit/1000)*11);return`<article class="card"><div class="visual"><span class="badge">${lit.toLocaleString()}L</span><span class="royal-mark">ROYAL TANKS</span><img class="standard" style="width:${scale}%;height:${scale}%;" src="${p[2]}" alt="${p[0]}" loading="lazy" onerror="this.style.display='none';this.parentElement.classList.add('image-missing')"></div><div class="body"><span>ROYAL TANKS</span><h3>${p[0]}</h3><p>Black Royal Tanks water-storage tank.</p><div class="price">Ksh. ${p[1].toLocaleString()}</div><button class="add" onclick='add(${JSON.stringify(p[0])},${p[1]},this)'>ADD TO CART</button></div></article>`}products.innerHTML=tankProducts.map(card).join('');form.onsubmit=e=>{e.preventDefault();let lines=cart.map((x,i)=>`${i+1}. ${x.name} | Qty: ${x.qty} | Ksh. ${(x.price*x.qty).toLocaleString()}`).join('\n');let m=`HELLO 👋 ROYAL TANKS, I would like to place an order.\n\nName: ${name.value}\nPhone: ${phone.value}\nDelivery Area: ${area.value}\n\nORDER:\n${lines}\n\nTOTAL: Ksh. ${cart.reduce((a,x)=>a+x.price*x.qty,0).toLocaleString()}`;window.open('https://wa.me/254102938597?text='+encodeURIComponent(m),'_blank')};renderCart();</script></body></html>
