a: ${document.getElementById('area').value}\n\nORDER:\n${list}\n\nTOTAL: KSh. ${total.toLocaleString()}`;window.open('https://wa.me/254102938597?text='+encodeURIComponent(msg),'_blank')}function card(p,i){return`<article class="card"><div class="pic"><img src="${p[2]}" alt="Royal Tanks ${p[0]}" loading="lazy" onerror="this.onerror=null;this.src=img1000"><span class="brand">ROYAL TANKS</span></div><div class="info"><h2>${p[0]}</h2><p>Royal Water Tank</p><div class="price">KSh. ${p[1].toLocaleString()}</div><button class="add" onclick='add(${i},${JSON.stringify(p[0])},${p[1]},this)'>ADD TO CART</button></div></article>`}document.getElementById('products').innerHTML=tankProducts.map(card).join('');render();</script></body></html>
