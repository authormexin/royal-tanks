<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Royal Tanks | Shop Now</title><link rel="stylesheet" href="style.css"><style>.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:24px}.card{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 8px 25px #0001}.visual{height:290px;display:flex;align-items:center;justify-content:center;background:#f5f8fb;padding:18px}.visual img{width:100%;height:100%;object-fit:contain;filter:grayscale(1) contrast(1.15) brightness(.45) drop-shadow(0 12px 10px #0003)}.body{padding:18px}.body h3{color:#0754a4}.price{font-size:19px;font-weight:900;color:#0754a4;margin:12px 0}.add{width:100%;padding:12px;border:0;border-radius:9px;background:#d7a72c;font-weight:900}.add.added{background:#16a34a;color:#fff}.cart{position:fixed;right:20px;bottom:20px;background:#0754a4;color:#fff;border:0;border-radius:30px;padding:14px 20px;font-weight:900;z-index:20}.count{background:#d7a72c;color:#111;border-radius:50%;padding:3px 8px}.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#16a34a;color:#fff;padding:13px 20px;border-radius:10px;opacity:0;z-index:30}.toast.show{opacity:1}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:40;padding:5%}.panel{background:#fff;max-width:650px;margin:auto;padding:25px;border-radius:18px;max-height:90vh;overflow:auto}.row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #ddd}.checkout{width:100%;padding:14px;background:#16a34a;color:#fff;border:0;border-radius:9px;font-weight:900}.close{float:right}.hero{padding:55px 7%;background:linear-gradient(135deg,#061a2e,#0754a4);color:#fff}.hero small{color:#d7a72c;font-weight:900}.hero h1{font-size:clamp(38px,6vw,60px)}main{padding:30px 7%}footer{background:#061a2e;color:#fff;padding:25px;text-align:center;margin-top:50px}label{display:block;margin:12px 0;font-weight:800}input{width:100%;padding:11px;box-sizing:border-box}.tank-1000{width:45%!important;height:45%!important}.tank-2000{width:53%!important;height:53%!important}.tank-3000{width:59%!important;height:59%!important}.tank-4000{width:63%!important;height:63%!important}.tank-5000{width:67%!important;height:67%!important}.tank-6000{width:71%!important;height:71%!important}.tank-8000{width:76%!important;height:76%!important}.tank-10000{width:81%!important;height:81%!important}.tank-16000{width:88%!important;height:88%!important}.tank-20000{width:91%!important;height:91%!important}.tank-24000{width:94%!important;height:94%!important}</style></head><body><header><a class="logo" href="index.html">ROYAL <span>TANKS</span></a><nav><a href="index.html">Home</a><a href="catalogue.html">Shop Now</a><a href="index.html#about">About</a><a href="index.html#contact">Contact</a></nav></header><section class="hero"><small>ROYAL TANKS • NAKURU</small><h1>Shop Royal Water Tanks</h1><p>Only the currently supplied tank sizes and official prices are displayed.</p></section><main><div class="grid" id="products"></div></main><div class="toast" id="toast">✓ Added to cart</div><button class="cart" onclick="openCart()">🛒 Cart <span class="count" id="count">0</span></button><div class="modal" id="cartModal"><div class="panel"><button class="close" onclick="closeCart()">×</button><h2>Your Cart</h2><div id="items"></div><h3 id="total"></h3><button class="checkout" onclick="openCheckout()">ORDER NOW VIA WHATSAPP</button></div></div><div class="modal" id="checkoutModal"><div class="panel"><button class="close" onclick="closeCheckout()">×</button><b>HELLO 👋</b><h2>Complete Your Order</h2><form id="form"><label>Full Name<input id="name" required></label><label>Phone Number<input id="phone" required type="tel"></label><label>Delivery Town / Area<input id="area" required></label><button class="checkout">SEND ORDER TO WHATSAPP</button></form></div></div><footer>© 2026 Royal Tanks • Nakuru, Kenya • 0102938597</footer><script>const price={'1,000L':4500,'2,000L':10500,'3,000L':12500,'4,000L':14500,'5,000L':16500,'6,000L':19500,'8,000L':24500,'10,000L':32500,'16,000L':88500,'20,000L':137500,'24,000L':162500};const image='https://royal.ps/public/storage/products/April2021/WG823h8dWGeW8W2JlMhw.jpg';let cart=JSON.parse(localStorage.getItem('royalCart')||'[]');function sizeClass(s){return'tank-'+s.replace(',','').replace('L','')}function add(n,p,b){let x=cart.find(a=>a.name===n);x?x.qty++:cart.push({name:n,price:p,qty:1});save();b.classList.add('added');b.textContent='✓ Added to Cart';setTimeout(()=>{b.classList.remove('added');b.textContent='ADD TO CART'},1400);toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1600)}function save(){localStorage.setItem('royalCart',JSON.stringify(cart));renderCart()}function remove(i){cart.splice(i,1);save()}function qty(i,d){cart[i].qty=Math.max(1,cart[i].qty+d);save()}function renderCart(){count.textContent=cart.reduce((a,x)=>a+x.qty,0);items.innerHTML=cart.length?cart.map((x,i)=>`<div class="row"><span><b>${x.name}</b><br>Ksh. ${x.price.toLocaleString()}</span><span><button onclick="qty(${i},-1)">−</button> ${x.qty} <button onclick="qty(${i},1)">+</button> <button onclick="remove(${i})">Delete</button></span></div>`).join(''):'<p>Your cart is empty.</p>';let t=cart.reduce((a,x)=>a+x.price*x.qty,0);total.textContent='Total: Ksh. '+t.toLocaleString()}function openCart(){cartModal.style.display='block';renderCart()}function closeCart(){cartModal.style.display='none'}function openCheckout(){if(!cart.length)return alert('Please add a tank first.');closeCart();checkoutModal.style.display='block'}function closeCheckout(){checkoutModal.style.display='none'}function card(s){return`<article class="card"><div class="visual"><img class="${sizeClass(s)}" src="${image}" alt="Royal Water Tank ${s}" loading="lazy"></div><div class="body"><span>ROYAL TANKS</span><h3>Royal Water Tank ${s}</h3><p>Black upright Royal water tank.</p><div class="price">Ksh. ${price[s].toLocaleString()}</div><button class="add" onclick='add(${JSON.stringify('Royal Water Tank '+s)},${price[s]},this)'>ADD TO CART</button></div></article>`}products.innerHTML=Object.keys(price).map(card).join('');form.onsubmit=e=>{e.preventDefault();let lines=cart.map((x,i)=>`${i+1}. ${x.name} | Qty: ${x.qty} | Ksh. ${(x.price*x.qty).toLocaleString()}`).join('\n');let m=`HELLO 👋 ROYAL TANKS, I would like to place an order.\n\nName: ${name.value}\nPhone: ${phone.value}\nDelivery Area: ${area.value}\n\nORDER:\n${lines}\n\nPlease confirm availability and delivery.`;window.open('https://wa.me/254102938597?text='+encodeURIComponent(m),'_blank')};renderCart();</script></body></html>
